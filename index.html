<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADWA CHALLENGE - Digital Ecosystem</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            adwa: {
              gold: '#D4AF37',
              green: '#008751',
              slate: '#09090B',
              card: '#121215',
              border: '#27272A'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen bg-black">

  <!-- Mobile Container Shell -->
  <div className="w-full max-w-md bg-adwa-slate min-h-screen relative flex flex-col border-x border-adwa-border shadow-2xl overflow-x-hidden pb-safe">
    
    <!-- TOP HEADER -->
    <header className="sticky top-0 z-40 bg-adwa-slate/90 backdrop-blur-md px-4 py-3 border-b border-adwa-border flex justify-between items-center">
      <div className="flex items-center gap-2" onclick="navigateTo('home')">
        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-adwa-gold to-emerald-600 flex items-center justify-center font-black text-black text-sm">
          AC
        </div>
        <div>
          <h1 className="text-sm font-extrabold tracking-wider text-adwa-gold leading-none">ADWA CHALLENGE</h1>
          <p className="text-[10px] font-medium text-emerald-400 tracking-widest mt-0.5 uppercase">WALK • RUN • COMPETE • WIN</p>
        </div>
      </div>
      <div className="flex items-center gap-3">
        <button onclick="navigateTo('marketplace')" className="relative p-1.5 text-zinc-400 hover:text-amber-400">
          <i className="fa-solid fa-cart-shopping text-sm"></i>
          <span id="cart-badge" className="absolute -top-1 -right-1 bg-emerald-500 text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
        <div onclick="navigateTo('profile')" className="w-8 h-8 rounded-full bg-zinc-800 border border-adwa-gold/50 flex items-center justify-center text-xs font-bold text-adwa-gold cursor-pointer">
          YA
        </div>
      </div>
    </header>

    <!-- DYNAMIC SCREEN CONTENT AREA -->
    <main id="app-viewport" className="flex-1 p-4">
      <!-- Views rendered dynamically via JavaScript -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50 bg-adwa-card/95 backdrop-blur-lg border-t border-adwa-border px-2 py-2 flex justify-around items-center">
      <button id="nav-home" onclick="navigateTo('home')" className="flex flex-col items-center gap-1 text-adwa-gold">
        <i className="fa-solid fa-house text-base"></i>
        <span className="text-[10px] font-semibold">Home</span>
      </button>
      <button id="nav-challenges" onclick="navigateTo('challenges')" className="flex flex-col items-center gap-1 text-zinc-500">
        <i className="fa-solid fa-trophy text-base"></i>
        <span className="text-[10px] font-semibold">Challenges</span>
      </button>
      <button id="nav-activity" onclick="navigateTo('activity')" className="flex flex-col items-center gap-1 text-zinc-500">
        <i className="fa-solid fa-[#008751] fa-person-running text-base"></i>
        <span className="text-[10px] font-semibold">Activity</span>
      </button>
      <button id="nav-leaderboard" onclick="navigateTo('leaderboard')" className="flex flex-col items-center gap-1 text-zinc-500">
        <i className="fa-solid fa-ranking-star text-base"></i>
        <span className="text-[10px] font-semibold">Rankings</span>
      </button>
      <button id="nav-profile" onclick="navigateTo('profile')" className="flex flex-col items-center gap-1 text-zinc-500">
        <i className="fa-solid fa-user text-base"></i>
        <span className="text-[10px] font-semibold">Profile</span>
      </button>
    </nav>
  </div>

  <!-- JAVASCRIPT APP LOGIC & STATE ENGINE -->
  <script>
    // GLOBAL APPLICATION STATE
    const state = {
      user: {
        name: "Yisak",
        points: 1250,
        todayDistance: 2.8,
        todayTarget: 5.0,
        totalDistance: 142.5,
        activitiesCount: 38,
        badges: ["5K Walker", "Adwa Pioneer", "Civic Champion"]
      },
      cart: [],
      activeTracking: null,
      trackingTimer: null,
      trackingData: { distance: 0.0, time: 0, calories: 0, speed: 0.0, type: 'Run' },
      activeChallenge: null
    };

    // VIEW ROUTER ENGINE
    function navigateTo(screenId, params = {}) {
      const viewport = document.getElementById('app-viewport');
      window.scrollTo(0, 0);

      // Update Bottom Navigation Highlight
      const navItems = ['home', 'challenges', 'activity', 'leaderboard', 'profile'];
      navItems.forEach(item => {
        const btn = document.getElementById(`nav-${item}`);
        if (btn) {
          if (item === screenId) {
            btn.className = "flex flex-col items-center gap-1 text-adwa-gold font-bold";
          } else {
            btn.className = "flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300";
          }
        }
      });

      // Render Screen
      switch(screenId) {
        case 'home':
          viewport.innerHTML = renderHomeScreen();
          break;
        case 'challenges':
          viewport.innerHTML = renderChallengesScreen();
          break;
        case 'activity':
          viewport.innerHTML = renderActivityScreen();
          break;
        case 'leaderboard':
          viewport.innerHTML = renderLeaderboardScreen();
          break;
        case 'profile':
          viewport.innerHTML = renderProfileScreen();
          break;
        
        // Ecosystem Deep Services
        case 'service-run':
          viewport.innerHTML = renderRunDashboard();
          break;
        case 'service-walk':
          viewport.innerHTML = renderWalkDashboard();
          break;
        case 'marketplace':
          viewport.innerHTML = renderMarketplaceScreen();
          break;
        case 'service-cycling':
          viewport.innerHTML = renderCyclingDashboard();
          break;
        case 'service-cycling-ads':
          viewport.innerHTML = renderCyclingAdsScreen();
          break;
        case 'service-bakery':
          viewport.innerHTML = renderBakeryScreen();
          break;
        case 'service-futsal':
          viewport.innerHTML = renderFutsalScreen(params.tab || 'hotels');
          break;
        
        // Interactive Flow Screens
        case 'challenge-detail':
          viewport.innerHTML = renderChallengeDetailScreen(params.id);
          break;
        case 'gps-tracking':
          viewport.innerHTML = renderGPSScreen(params.type || 'Activity');
          initGPSSimulation(params.type || 'Activity');
          break;
        case 'activity-result':
          viewport.innerHTML = renderActivityResultScreen();
          break;
        case 'rewards':
          viewport.innerHTML = renderRewardsScreen();
          break;
        default:
          viewport.innerHTML = renderHomeScreen();
      }
    }

    // --- SCREEN RENDERERS ---

    // 1. HOME SCREEN
    function renderHomeScreen() {
      return `
        <div className="space-y-5 animate-fadeIn">
          <!-- Hero Section -->
          <div className="bg-gradient-to-br from-zinc-900 via-adwa-card to-emerald-950/40 p-4 rounded-2xl border border-adwa-gold/30 shadow-lg">
            <div className="flex justify-between items-start">
              <div>
                <p className="text-xs text-zinc-400 font-medium">Good morning,</p>
                <h2 className="text-xl font-black text-white">${state.user.name} 👋</h2>
              </div>
              <div onclick="navigateTo('rewards')" className="bg-adwa-gold/10 border border-adwa-gold/40 px-3 py-1 rounded-full flex items-center gap-1.5 cursor-pointer">
                <i className="fa-solid fa-coins text-adwa-gold text-xs"></i>
                <span className="text-xs font-bold text-adwa-gold">${state.user.points} PTS</span>
              </div>
            </div>

            <!-- Daily Activity Meter -->
            <div className="mt-4 pt-3 border-t border-zinc-800">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className="text-zinc-300">Today's Distance</span>
                <span className="text-emerald-400">${state.user.todayDistance} / ${state.user.todayTarget} KM</span>
              </div>
              <div className="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-emerald-500 to-adwa-gold rounded-full" style="width: ${(state.user.todayDistance / state.user.todayTarget)*100}%"></div>
              </div>
            </div>
          </div>

          <!-- Active Quick Challenges Carousel -->
          <div>
            <div className="flex justify-between items-center mb-2">
              <h3 className="text-xs font-extrabold uppercase tracking-wider text-zinc-400">Active Challenges</h3>
              <button onclick="navigateTo('challenges')" className="text-xs font-bold text-adwa-gold">See All</button>
            </div>
            <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
              <div onclick="navigateTo('challenge-detail', {id: 'walk-home'})" className="min-w-[150px] bg-adwa-card border border-emerald-500/40 p-3 rounded-xl cursor-pointer">
                <span className="text-[9px] font-bold text-emerald-400 uppercase bg-emerald-400/10 px-2 py-0.5 rounded">Mobility</span>
                <h4 className="text-xs font-extrabold text-white mt-1.5">Walk Home</h4>
                <p className="text-[10px] text-zinc-400">Safe Route Active</p>
              </div>
              <div onclick="navigateTo('challenge-detail', {id: '1km-run'})" className="min-w-[150px] bg-adwa-card border border-amber-500/40 p-3 rounded-xl cursor-pointer">
                <span className="text-[9px] font-bold text-amber-400 uppercase bg-amber-400/10 px-2 py-0.5 rounded">Sprint</span>
                <h4 className="text-xs font-extrabold text-white mt-1.5">1KM Run</h4>
                <p className="text-[10px] text-zinc-400">Entry Sprint</p>
              </div>
              <div onclick="navigateTo('challenge-detail', {id: 'family'})" className="min-w-[150px] bg-adwa-card border border-purple-500/40 p-3 rounded-xl cursor-pointer">
                <span className="text-[9px] font-bold text-purple-400 uppercase bg-purple-400/10 px-2 py-0.5 rounded">Community</span>
                <h4 className="text-xs font-extrabold text-white mt-1.5">Family Shield</h4>
                <p className="text-[10px] text-zinc-400">Team Challenge</p>
              </div>
            </div>
          </div>

          <!-- Explore Ecosystem Grid -->
          <div>
            <h3 className="text-xs font-extrabold uppercase tracking-wider text-zinc-400 mb-3">Explore Ecosystem</h3>
            <div className="grid grid-cols-2 gap-3">
              <div onclick="navigateTo('service-run')" className="bg-gradient-to-br from-amber-500/10 to-adwa-card border border-amber-500/30 p-3.5 rounded-xl cursor-pointer hover:border-amber-400">
                <i className="fa-solid fa-person-running text-amber-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Adwa Run</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Activities & Communities</p>
              </div>
              <div onclick="navigateTo('service-walk')" className="bg-gradient-to-br from-emerald-500/10 to-adwa-card border border-emerald-500/30 p-3.5 rounded-xl cursor-pointer hover:border-emerald-400">
                <i className="fa-solid fa-shoe-prints text-emerald-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Adwa Walk</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Civic Step Tracking</p>
              </div>
              <div onclick="navigateTo('marketplace')" className="bg-gradient-to-br from-yellow-500/10 to-adwa-card border border-yellow-500/30 p-3.5 rounded-xl cursor-pointer hover:border-yellow-400">
                <i className="fa-solid fa-store text-yellow-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Marketplace</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Products & Rewards</p>
              </div>
              <div onclick="navigateTo('service-cycling')" className="bg-gradient-to-br from-teal-500/10 to-adwa-card border border-teal-500/30 p-3.5 rounded-xl cursor-pointer hover:border-teal-400">
                <i className="fa-solid fa-bicycle text-teal-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Adwa Cycling</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Rider Community</p>
              </div>
              <div onclick="navigateTo('service-cycling-ads')" className="bg-gradient-to-br from-blue-500/10 to-adwa-card border border-blue-500/30 p-3.5 rounded-xl cursor-pointer hover:border-blue-400">
                <i className="fa-solid fa-rectangle-ad text-blue-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Cycling Ads</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Rider Ad Network</p>
              </div>
              <div onclick="navigateTo('service-bakery')" className="bg-gradient-to-br from-orange-500/10 to-adwa-card border border-orange-500/30 p-3.5 rounded-xl cursor-pointer hover:border-orange-400">
                <i className="fa-solid fa-bread-slice text-orange-400 text-xl mb-2"></i>
                <h4 className="text-sm font-bold text-white">Bakery Sub</h4>
                <p className="text-[10px] text-zinc-400 mt-0.5">Daily Bread Delivery</p>
              </div>
            </div>

            <!-- Full Width Futsal Card -->
            <div onclick="navigateTo('service-futsal')" className="mt-3 bg-gradient-to-r from-emerald-900/40 via-adwa-card to-adwa-gold/20 border border-emerald-500/40 p-4 rounded-xl cursor-pointer flex justify-between items-center">
              <div>
                <span className="text-[9px] font-bold text-adwa-gold bg-adwa-gold/10 px-2 py-0.5 rounded uppercase">B2B & Hospitality</span>
                <h4 className="text-base font-black text-white mt-1">Adwa Futsal Tournaments</h4>
                <p className="text-xs text-zinc-400">Hotels & Bank League Brackets</p>
              </div>
              <i className="fa-solid fa-trophy text-2xl text-adwa-gold"></i>
            </div>
          </div>

          <!-- Top Today Preview -->
          <div className="bg-adwa-card border border-adwa-border p-3 rounded-xl">
            <div className="flex justify-between items-center mb-2">
              <h4 className="text-xs font-bold text-zinc-300">Today's Leaderboard Leader</h4>
              <button onclick="navigateTo('leaderboard')" className="text-[10px] font-bold text-emerald-400">View Full</button>
            </div>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">1</div>
                <div>
                  <p className="text-xs font-bold text-white">Abebe B.</p>
                  <p className="text-[10px] text-zinc-400">14.2 KM • Walk Home</p>
                </div>
              </div>
              <span className="text-xs font-extrabold text-adwa-gold">1,850 PTS</span>
            </div>
          </div>
        </div>
      `;
    }

    // 2. CHALLENGES SCREEN
    function renderChallengesScreen() {
      return `
        <div className="space-y-4">
          <div className="border-b border-zinc-800 pb-2">
            <h2 className="text-lg font-black text-white">CHALLENGES HUB</h2>
            <p className="text-xs text-zinc-400">Select a category and join verified movement challenges.</p>
          </div>

          <!-- Category Sections -->
          <div className="space-y-4">
            
            <!-- RUNNING CATEGORY -->
            <div>
              <h3 className="text-xs font-extrabold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i className="fa-solid fa-person-running"></i> Running Challenges
              </h3>
              <div className="space-y-2">
                <div onclick="navigateTo('challenge-detail', {id: '500m-run'})" className="bg-adwa-card border border-zinc-800 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <h4 className="text-sm font-bold text-white">Adwa 500m Run</h4>
                    <p className="text-xs text-zinc-400">Beginner-friendly sprint</p>
                  </div>
                  <button className="bg-amber-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: '1km-run'})" className="bg-adwa-card border border-zinc-800 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <h4 className="text-sm font-bold text-white">Adwa 1KM Run</h4>
                    <p className="text-xs text-zinc-400">Entry distance challenge</p>
                  </div>
                  <button className="bg-amber-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: 'cause-run'})" className="bg-adwa-card border border-rose-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <span className="text-[9px] font-bold text-rose-400 uppercase bg-rose-400/10 px-1.5 py-0.5 rounded">Social Impact</span>
                    <h4 className="text-sm font-bold text-white mt-0.5">Adwa Run for Cause</h4>
                    <p className="text-xs text-zinc-400">1 KM = 10 ETB Sponsor Donation</p>
                  </div>
                  <button className="bg-rose-500 text-white font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: 'ethio-telecom'})" className="bg-adwa-card border border-blue-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <span className="text-[9px] font-bold text-blue-400 uppercase bg-blue-400/10 px-1.5 py-0.5 rounded">Corporate Sponsor</span>
                    <h4 className="text-sm font-bold text-white mt-0.5">Ethio telecom Challenge</h4>
                    <p className="text-xs text-zinc-400">Win Unlimited Airtime & Merch</p>
                  </div>
                  <button className="bg-blue-600 text-white font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
              </div>
            </div>

            <!-- WALKING CATEGORY -->
            <div>
              <h3 className="text-xs font-extrabold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i className="fa-solid fa-shoe-prints"></i> Walking Mobility
              </h3>
              <div onclick="navigateTo('challenge-detail', {id: 'walk-home'})" className="bg-adwa-card border border-emerald-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                <div>
                  <span className="text-[9px] font-bold text-emerald-400 uppercase bg-emerald-400/10 px-1.5 py-0.5 rounded">Traffic Relief</span>
                  <h4 className="text-sm font-bold text-white mt-0.5">Adwa Walk Home</h4>
                  <p className="text-xs text-zinc-400">Safe peak-hour urban routes</p>
                </div>
                <button className="bg-emerald-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
              </div>
            </div>

            <!-- FAMILY CATEGORY -->
            <div>
              <h3 className="text-xs font-extrabold text-purple-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i className="fa-solid fa-users"></i> Family & Teams
              </h3>
              <div onclick="navigateTo('challenge-detail', {id: 'family'})" className="bg-adwa-card border border-purple-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                <div>
                  <h4 className="text-sm font-bold text-white">Family Members Challenge</h4>
                  <p className="text-xs text-zinc-400">Combined family distance ranking</p>
                </div>
                <button className="bg-purple-600 text-white font-bold text-xs px-3 py-1 rounded-lg">Join</button>
              </div>
            </div>

            <!-- CYCLING CATEGORY -->
            <div>
              <h3 className="text-xs font-extrabold text-teal-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i className="fa-solid fa-bicycle"></i> Cycling
              </h3>
              <div className="grid grid-cols-2 gap-2">
                <div onclick="navigateTo('challenge-detail', {id: '1km-cycling'})" className="bg-adwa-card border border-zinc-800 p-3 rounded-xl cursor-pointer">
                  <h4 className="text-xs font-bold text-white">Adwa 1KM Cycling</h4>
                  <p className="text-[10px] text-zinc-400">Sprint ride</p>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: '3km-cycling'})" className="bg-adwa-card border border-zinc-800 p-3 rounded-xl cursor-pointer">
                  <h4 className="text-xs font-bold text-white">Adwa 3KM Cycling</h4>
                  <p className="text-[10px] text-zinc-400">Distance ride</p>
                </div>
              </div>
            </div>

            <!-- FUTSAL CATEGORY -->
            <div>
              <h3 className="text-xs font-extrabold text-adwa-gold uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i className="fa-solid fa-trophy"></i> Futsal Tournaments
              </h3>
              <div className="space-y-2">
                <div onclick="navigateTo('service-futsal', {tab: 'hotels'})" className="bg-adwa-card border border-adwa-gold/30 p-3 rounded-xl flex justify-between items-center cursor-pointer">

    // 3. ACTIVITY DASHBOARD SCREEN
    function renderActivityScreen() {
      return `
        <div className="space-y-5">
          <div className="border-b border-zinc-800 pb-2 flex justify-between items-center">
            <div>
              <h2 className="text-lg font-black text-white">ACTIVITY DASHBOARD</h2>
              <p className="text-xs text-zinc-400">Real-time metrics & session tracking</p>
            </div>
            <button onclick="navigateTo('gps-tracking', {type: 'Run'})" className="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 pulse-ring">

          </div>

          <!-- Summary Metric Cards -->

          <p className="text-xs text-zinc-400">Civic step tracking and traffic congestion relief walking programs.</p>
          <button onclick="navigateTo('gps-tracking', {type: 'Walk'})" className="w-full bg-emerald-500 text-black font-black py-3 rounded-xl text-xs uppercase">Start Walk Home</button>
        </div>
      `;
    }

    function renderCyclingDashboard() {
      return `
        <div className="space-y-4">
          <button onclick="navigateTo('home')" className="text-xs text-zinc-400 font-bold"><i className="fa-solid fa-arrow-left"></i> Home</button>
          <h2 className="text-lg font-black text-teal-400">ADWA CYCLING DASHBOARD</h2>
          <p className="text-xs text-zinc-400">Eco-friendly cycling tracking and rider verification.</p>
          <button onclick="navigateTo('gps-tracking', {type: 'Cycling'})" className="w-full bg-teal-500 text-black font-black py-3 rounded-xl text-xs uppercase">Start Cycling Session</button>
        </div>
      `;
    }

    function renderRewardsScreen() {
      return `
        <div className="space-y-4">
          <button onclick="navigateTo('home')" className="text-xs text-zinc-400 font-bold"><i className="fa-solid fa-arrow-left"></i> Back</button>
          <h2 className="text-lg font-black text-adwa-gold">REWARDS HUB</h2>
          <p className="text-xs text-zinc-400">Current Balance: ${state.user.points} PTS</p>
        </div>
      `;
    }

    // --- UTILITY LOGIC ---
    function addToCart(itemName) {
      state.cart.push(itemName);
      document.getElementById('cart-badge').innerText = state.cart.length;
      alert(`${itemName} redeemed and added to your wallet!`);
    }

    function initGPSSimulation(type) {
      state.trackingData = { distance: 0.0, time: 0, calories: 0, speed: 0.0, type: type };
      if (state.trackingTimer) clearInterval(state.trackingTimer);

      state.trackingTimer = setInterval(() => {
        state.trackingData.time += 1;
        state.trackingData.distance += 0.02;
        state.trackingData.calories += 1;
        state.trackingData.speed = 12.4;

        const distEl = document.getElementById('track-dist');
        const timeEl = document.getElementById('track-time');
        const speedEl = document.getElementById('track-speed');

        if (distEl) distEl.innerText = `${state.trackingData.distance.toFixed(2)} KM`;
        if (timeEl) {
          const mins = String(Math.floor(state.trackingData.time / 60)).padStart(2, '0');
          const secs = String(state.trackingData.time % 60).padStart(2, '0');
          timeEl.innerText = `${mins}:${secs}`;
        }
        if (speedEl) speedEl.innerText = `${state.trackingData.speed} km/h`;
      }, 1000);
    }

    function finishGPSSimulation() {
      if (state.trackingTimer) clearInterval(state.trackingTimer);
      state.user.points += Math.floor(state.trackingData.distance * 50);
      state.user.totalDistance += parseFloat(state.trackingData.distance.toFixed(2));
      navigateTo('activity-result');
    }

    // INITIAL APP LAUNCH
    window.onload = () => {
      navigateTo('home');
    };
  </script>
</body>
  </html>
