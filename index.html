<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADWA CHALLENGE - Digital Ecosystem</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            adwa: {
              gold: '#D4AF37',
              green: '#008751',
              slate: '#09090B',
              card: '#121215',
              border: '#27272A'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: 4.5rem; }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen bg-black">

  <!-- Mobile Container Shell -->
  <div class="w-full max-w-md bg-adwa-slate min-h-screen relative flex flex-col border-x border-adwa-border shadow-2xl overflow-x-hidden pb-safe">
    
    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-adwa-slate/90 backdrop-blur-md px-4 py-3 border-b border-adwa-border flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-adwa-gold to-emerald-600 flex items-center justify-center font-black text-black text-sm">
          AC
        </div>
        <div>
          <h1 class="text-sm font-extrabold tracking-wider text-adwa-gold leading-none">ADWA CHALLENGE</h1>
          <p class="text-[10px] font-medium text-emerald-400 tracking-widest mt-0.5 uppercase">WALK • RUN • COMPETE • WIN</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="navigateTo('marketplace')" class="relative p-1.5 text-zinc-400 hover:text-amber-400">
          <i class="fa-solid fa-cart-shopping text-sm"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-emerald-500 text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
        <div onclick="navigateTo('profile')" class="w-8 h-8 rounded-full bg-zinc-800 border border-adwa-gold/50 flex items-center justify-center text-xs font-bold text-adwa-gold cursor-pointer">
          YA
        </div>
      </div>
    </header>

    <!-- DYNAMIC SCREEN CONTENT AREA -->
    <main id="app-viewport" class="flex-1 p-4">
      <!-- Dynamic Views Rendered Here -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50 bg-adwa-card/95 backdrop-blur-lg border-t border-adwa-border px-2 py-2 flex justify-around items-center">
      <button id="nav-home" onclick="navigateTo('home')" class="flex flex-col items-center gap-1 text-adwa-gold">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button id="nav-challenges" onclick="navigateTo('challenges')" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-trophy text-base"></i>
        <span class="text-[10px] font-semibold">Challenges</span>
      </button>
      <button id="nav-activity" onclick="navigateTo('activity')" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-person-running text-base"></i>
        <span class="text-[10px] font-semibold">Activity</span>
      </button>
      <button id="nav-leaderboard" onclick="navigateTo('leaderboard')" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-ranking-star text-base"></i>
        <span class="text-[10px] font-semibold">Rankings</span>
      </button>
      <button id="nav-profile" onclick="navigateTo('profile')" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-user text-base"></i>
        <span class="text-[10px] font-semibold">Profile</span>
      </button>
    </nav>
  </div>

  <!-- JAVASCRIPT APPLICATION ENGINE -->
  <script>
    const state = {
      user: {
        name: "Yisak",
        points: 1250,
        todayDistance: 2.8,
        todayTarget: 5.0,
        totalDistance: 142.5,
        activitiesCount: 38,
        badges: ["5K Walker", "Adwa Pioneer", "Civic Champion"]
      },
      cart: [],
      activeTracking: null,
      trackingTimer: null,
      trackingData: { distance: 0.0, time: 0, calories: 0, speed: 0.0, type: 'Run' }
    };

    function navigateTo(screenId, params = {}) {
      const viewport = document.getElementById('app-viewport');
      window.scrollTo(0, 0);

      const navItems = ['home', 'challenges', 'activity', 'leaderboard', 'profile'];
      navItems.forEach(item => {
        const btn = document.getElementById(`nav-${item}`);
        if (btn) {
          if (item === screenId) {
            btn.className = "flex flex-col items-center gap-1 text-adwa-gold font-bold";
          } else {
            btn.className = "flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300";
          }
        }
      });

      switch(screenId) {
        case 'home':
          viewport.innerHTML = renderHomeScreen();
          break;
        case 'challenges':
          viewport.innerHTML = renderChallengesScreen();
          break;
        case 'activity':
          viewport.innerHTML = renderActivityScreen();
          break;
        case 'leaderboard':
          viewport.innerHTML = renderLeaderboardScreen();
          break;
        case 'profile':
          viewport.innerHTML = renderProfileScreen();
          break;
        case 'service-run':
          viewport.innerHTML = renderRunDashboard();
          break;
        case 'service-walk':
          viewport.innerHTML = renderWalkDashboard();
          break;
        case 'marketplace':
          viewport.innerHTML = renderMarketplaceScreen();
          break;
        case 'service-cycling':
          viewport.innerHTML = renderCyclingDashboard();
          break;
        case 'service-cycling-ads':
          viewport.innerHTML = renderCyclingAdsScreen();
          break;
        case 'service-bakery':
          viewport.innerHTML = renderBakeryScreen();
          break;
        case 'service-futsal':
          viewport.innerHTML = renderFutsalScreen(params.tab || 'hotels');
          break;
        case 'challenge-detail':
          viewport.innerHTML = renderChallengeDetailScreen(params.id);
          break;
        case 'gps-tracking':
          viewport.innerHTML = renderGPSScreen(params.type || 'Activity');
          initGPSSimulation(params.type || 'Activity');
          break;
        case 'activity-result':
          viewport.innerHTML = renderActivityResultScreen();
          break;
        case 'rewards':
          viewport.innerHTML = renderRewardsScreen();
          break;
        default:
          viewport.innerHTML = renderHomeScreen();
      }
    }

    // 1. HOME SCREEN RENDERER
    function renderHomeScreen() {
      return `
        <div class="space-y-5">
          <div class="bg-gradient-to-br from-zinc-900 via-adwa-card to-emerald-950/40 p-4 rounded-2xl border border-adwa-gold/30 shadow-lg">
            <div class="flex justify-between items-start">
              <div>
                <p class="text-xs text-zinc-400 font-medium">Good morning,</p>
                <h2 class="text-xl font-black text-white">${state.user.name} 👋</h2>
              </div>
              <div onclick="navigateTo('rewards')" class="bg-adwa-gold/10 border border-adwa-gold/40 px-3 py-1 rounded-full flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-coins text-adwa-gold text-xs"></i>
                <span class="text-xs font-bold text-adwa-gold">${state.user.points} PTS</span>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-zinc-800">
              <div class="flex justify-between text-xs font-bold mb-1">
                <span class="text-zinc-300">Today's Distance</span>
                <span class="text-emerald-400">${state.user.todayDistance} / ${state.user.todayTarget} KM</span>
              </div>
              <div class="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-emerald-500 to-adwa-gold rounded-full" style="width: ${(state.user.todayDistance / state.user.todayTarget)*100}%"></div>
              </div>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-zinc-400">Active Challenges</h3>
              <button onclick="navigateTo('challenges')" class="text-xs font-bold text-adwa-gold">See All</button>
            </div>
            <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
              <div onclick="navigateTo('challenge-detail', {id: 'walk-home'})" class="min-w-[150px] bg-adwa-card border border-emerald-500/40 p-3 rounded-xl cursor-pointer">
                <span class="text-[9px] font-bold text-emerald-400 uppercase bg-emerald-400/10 px-2 py-0.5 rounded">Mobility</span>
                <h4 class="text-xs font-extrabold text-white mt-1.5">Walk Home</h4>
                <p class="text-[10px] text-zinc-400">Safe Route Active</p>
              </div>
              <div onclick="navigateTo('challenge-detail', {id: '1km-run'})" class="min-w-[150px] bg-adwa-card border border-amber-500/40 p-3 rounded-xl cursor-pointer">
                <span class="text-[9px] font-bold text-amber-400 uppercase bg-amber-400/10 px-2 py-0.5 rounded">Sprint</span>
                <h4 class="text-xs font-extrabold text-white mt-1.5">1KM Run</h4>
                <p class="text-[10px] text-zinc-400">Entry Sprint</p>
              </div>
              <div onclick="navigateTo('challenge-detail', {id: 'family'})" class="min-w-[150px] bg-adwa-card border border-purple-500/40 p-3 rounded-xl cursor-pointer">
                <span class="text-[9px] font-bold text-purple-400 uppercase bg-purple-400/10 px-2 py-0.5 rounded">Community</span>
                <h4 class="text-xs font-extrabold text-white mt-1.5">Family Shield</h4>
                <p class="text-[10px] text-zinc-400">Team Challenge</p>
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-zinc-400 mb-3">Explore Ecosystem</h3>
            <div class="grid grid-cols-2 gap-3">
              <div onclick="navigateTo('service-run')" class="bg-gradient-to-br from-amber-500/10 to-adwa-card border border-amber-500/30 p-3.5 rounded-xl cursor-pointer hover:border-amber-400">
                <i class="fa-solid fa-person-running text-amber-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Adwa Run</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Activities & Communities</p>
              </div>
              <div onclick="navigateTo('service-walk')" class="bg-gradient-to-br from-emerald-500/10 to-adwa-card border border-emerald-500/30 p-3.5 rounded-xl cursor-pointer hover:border-emerald-400">
                <i class="fa-solid fa-shoe-prints text-emerald-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Adwa Walk</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Civic Step Tracking</p>
              </div>
              <div onclick="navigateTo('marketplace')" class="bg-gradient-to-br from-yellow-500/10 to-adwa-card border border-yellow-500/30 p-3.5 rounded-xl cursor-pointer hover:border-yellow-400">
                <i class="fa-solid fa-store text-yellow-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Marketplace</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Products & Rewards</p>
              </div>
              <div onclick="navigateTo('service-cycling')" class="bg-gradient-to-br from-teal-500/10 to-adwa-card border border-teal-500/30 p-3.5 rounded-xl cursor-pointer hover:border-teal-400">
                <i class="fa-solid fa-bicycle text-teal-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Adwa Cycling</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Rider Community</p>
              </div>
              <div onclick="navigateTo('service-cycling-ads')" class="bg-gradient-to-br from-blue-500/10 to-adwa-card border border-blue-500/30 p-3.5 rounded-xl cursor-pointer hover:border-blue-400">
                <i class="fa-solid fa-rectangle-ad text-blue-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Cycling Ads</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Rider Ad Network</p>
              </div>
              <div onclick="navigateTo('service-bakery')" class="bg-gradient-to-br from-orange-500/10 to-adwa-card border border-orange-500/30 p-3.5 rounded-xl cursor-pointer hover:border-orange-400">
                <i class="fa-solid fa-bread-slice text-orange-400 text-xl mb-2"></i>
                <h4 class="text-sm font-bold text-white">Bakery Sub</h4>
                <p class="text-[10px] text-zinc-400 mt-0.5">Daily Bread Delivery</p>
              </div>
            </div>

            <div onclick="navigateTo('service-futsal')" class="mt-3 bg-gradient-to-r from-emerald-900/40 via-adwa-card to-adwa-gold/20 border border-emerald-500/40 p-4 rounded-xl cursor-pointer flex justify-between items-center">
              <div>
                <span class="text-[9px] font-bold text-adwa-gold bg-adwa-gold/10 px-2 py-0.5 rounded uppercase">B2B & Hospitality</span>
                <h4 class="text-base font-black text-white mt-1">Adwa Futsal Tournaments</h4>
                <p class="text-xs text-zinc-400">Hotels & Bank League Brackets</p>
              </div>
              <i class="fa-solid fa-trophy text-2xl text-adwa-gold"></i>
            </div>
          </div>
        </div>
      `;
    }

    // 2. CHALLENGES SCREEN RENDERER
    function renderChallengesScreen() {
      return `
        <div class="space-y-4">
          <div class="border-b border-zinc-800 pb-2">
            <h2 class="text-lg font-black text-white">CHALLENGES HUB</h2>
            <p class="text-xs text-zinc-400">Join verified movement challenges across disciplines.</p>
          </div>

          <div class="space-y-4">
            <div>
              <h3 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-person-running"></i> Running Challenges
              </h3>
              <div class="space-y-2">
                <div onclick="navigateTo('challenge-detail', {id: '500m-run'})" class="bg-adwa-card border border-zinc-800 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <h4 class="text-sm font-bold text-white">Adwa 500m Run</h4>
                    <p class="text-xs text-zinc-400">Beginner-friendly sprint</p>
                  </div>
                  <button class="bg-amber-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: '1km-run'})" class="bg-adwa-card border border-zinc-800 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <h4 class="text-sm font-bold text-white">Adwa 1KM Run</h4>
                    <p class="text-xs text-zinc-400">Entry distance challenge</p>
                  </div>
                  <button class="bg-amber-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
                <div onclick="navigateTo('challenge-detail', {id: 'cause-run'})" class="bg-adwa-card border border-rose-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                  <div>
                    <span class="text-[9px] font-bold text-rose-400 uppercase bg-rose-400/10 px-1.5 py-0.5 rounded">Social Impact</span>
                    <h4 class="text-sm font-bold text-white mt-0.5">Adwa Run for Cause</h4>
                    <p class="text-xs text-zinc-400">1 KM = 10 ETB Sponsor Donation</p>
                  </div>
                  <button class="bg-rose-500 text-white font-bold text-xs px-3 py-1 rounded-lg">Join</button>
                </div>
              </div>
            </div>

            <div>
              <h3 class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-shoe-prints"></i> Walking Mobility
              </h3>
              <div onclick="navigateTo('challenge-detail', {id: 'walk-home'})" class="bg-adwa-card border border-emerald-500/40 p-3 rounded-xl flex justify-between items-center cursor-pointer">
                <div>
                  <span class="text-[9px] font-bold text-emerald-400 uppercase bg-emerald-400/10 px-1.5 py-0.5 rounded">Traffic Relief</span>
                  <h4 class="text-sm font-bold text-white mt-0.5">Adwa Walk Home</h4>
                  <p class="text-xs text-zinc-400">Safe peak-hour urban routes</p>
                </div>
                <button class="bg-emerald-500 text-black font-bold text-xs px-3 py-1 rounded-lg">Join</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 3. ACTIVITY DASHBOARD
    function renderActivityScreen() {
      return `
        <div class="space-y-5">
          <div class="border-b border-zinc-800 pb-2 flex justify-between items-center">
            <div>
              <h2 class="text-lg font-black text-white">ACTIVITY DASHBOARD</h2>
              <p class="text-xs text-zinc-400">Real-time metrics & tracking</p>
            </div>
            <button onclick="navigateTo('gps-tracking', {type: 'Run'})" class="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 pulse-ring">
              <i class="fa-solid fa-play"></i> Start Track
            </button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-adwa-card border border-zinc-800 p-3 rounded-xl">
              <p class="text-[10px] text-zinc-400 font-bold uppercase">Total Steps Today</p>
              <h3 class="text-xl font-black text-emerald-400 mt-1">4,120</h3>
            </div>
            <div class="bg-adwa-card border border-zinc-800 p-3 rounded-xl">
              <p class="text-[10px] text-zinc-400 font-bold uppercase">Calories Burned</p>
              <h3 class="text-xl font-black text-amber-400 mt-1">310 KCAL</h3>
            </div>
          </div>
        </div>
      `;
    }

    // 4. LEADERBOARD SCREEN
    function renderLeaderboardScreen() {
      return `
        <div class="space-y-4">
          <div class="border-b border-zinc-800 pb-2">
            <h2 class="text-lg font-black text-white">ECOSYSTEM RANKINGS</h2>
            <p class="text-xs text-zinc-400">Verified participant standings</p>
          </div>
          <div class="space-y-2">
            <div class="bg-adwa-card border border-adwa-gold/50 p-3 rounded-xl flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="w-6 h-6 rounded-full bg-adwa-gold text-black font-black flex items-center justify-center text-xs">1</div>
                <div>
                  <h4 class="text-xs font-bold text-white">Abebe B.</h4>
                  <p class="text-[10px] text-zinc-400">Addis Ababa • 42.1 KM</p>
                </div>
              </div>
              <span class="text-xs font-black text-adwa-gold">3,450 PTS</span>
            </div>
          </div>
        </div>
      `;
    }

    // 5. PROFILE SCREEN
    function renderProfileScreen() {
      return `
        <div class="space-y-5">
          <div class="bg-adwa-card border border-adwa-border p-4 rounded-2xl text-center space-y-2">
            <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-adwa-gold p-0.5 mx-auto">
              <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center font-black text-xl text-adwa-gold">
                YA
              </div>
            </div>
            <h2 class="text-lg font-black text-white">${state.user.name}</h2>
            <p class="text-xs text-zinc-400">Adwa Pioneer Level 4</p>
          </div>
        </div>
      `;
    }

    // HELPER STUBS FOR FULL ROUTING
    function renderRunDashboard() { return renderActivityScreen(); }
    function renderWalkDashboard() { return renderActivityScreen(); }
    function renderMarketplaceScreen() { return `<div class="p-4"><h2 class="text-lg font-bold text-adwa-gold">Marketplace</h2></div>`; }
    function renderCyclingDashboard() { return renderActivityScreen(); }
    function renderCyclingAdsScreen() { return `<div class="p-4"><h2 class="text-lg font-bold text-blue-400">Cycling Ads</h2></div>`; }
    function renderBakeryScreen() { return `<div class="p-4"><h2 class="text-lg font-bold text-orange-400">Bakery Subscription</h2></div>`; }
    function renderFutsalScreen(tab) { return `<div class="p-4"><h2 class="text-lg font-bold text-emerald-400">Futsal ${tab}</h2></div>`; }
    function renderChallengeDetailScreen(id) { return renderActivityScreen(); }
    function renderGPSScreen(type) { return `<div class="p-4 text-center"><h2 class="text-lg font-bold text-emerald-400">Tracking ${type}...</h2></div>`; }
    function renderActivityResultScreen() { return renderHomeScreen(); }
    function renderRewardsScreen() { return renderProfileScreen(); }
    function initGPSSimulation() {}

    window.onload = () => {
      navigateTo('home');
    };
  </script>
</body>
</html>
